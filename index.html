<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>D3 Scores — NCAA Division III Football</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page:   #eef0f3;
    --card:   #ffffff;
    --line:   #d7dce3;
    --hair:   #e8ebef;
    --ink:    #16191d;
    --mid:    #5d6570;
    --mute:   #939ba6;
    --red:    #ce1126;
    --shell:  #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 400 15px/1.4 Barlow, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- masthead ---------- */
  .shell {
    position: sticky; top: 0; z-index: 10;
    background: var(--shell);
    border-bottom: 1px solid var(--line);
  }
  .bar {
    max-width: 1040px; margin: 0 auto;
    display: flex; align-items: center; gap: 12px;
    padding: 11px 16px 10px;
  }
  .mark {
    font-family: "Barlow Condensed", Barlow, sans-serif;
    font-weight: 700; font-size: 25px; line-height: 1;
    letter-spacing: 0.2px; margin: 0;
    display: flex; align-items: baseline; gap: 7px;
    white-space: nowrap; flex: none;
  }
  .mark i {
    font-style: normal; font-family: Barlow, sans-serif;
    font-size: 10px; font-weight: 600; letter-spacing: 1.4px;
    color: var(--mute); text-transform: uppercase;
  }
  /* The tagline is the first thing to go when the bar gets tight. */
  @media (max-width: 460px) { .mark i { display: none; } }
  select {
    margin-left: auto;
    font: 500 13px Barlow, sans-serif; color: var(--ink);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 5px; height: 32px; padding: 0 26px 0 9px;
    min-width: 0; max-width: 200px;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='11' viewBox='0 0 12 12'><path d='M2 4.5l4 4 4-4' fill='none' stroke='%235d6570' stroke-width='1.7' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat; background-position: right 8px center;
  }

  /* Week strip, scrolled horizontally like a date rail. */
  .weeks {
    max-width: 1040px; margin: 0 auto;
    display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none;
    padding: 0 10px;
  }
  .weeks::-webkit-scrollbar { display: none; }
  .weeks button {
    flex: none; background: none; border: 0; cursor: pointer;
    font: 600 13px Barlow, sans-serif; color: var(--mid);
    padding: 7px 11px 9px; position: relative; white-space: nowrap;
  }
  .weeks button[aria-current="true"] { color: var(--ink); }
  .weeks button[aria-current="true"]::after {
    content: ""; position: absolute; left: 8px; right: 8px; bottom: 0;
    height: 3px; background: var(--red); border-radius: 2px 2px 0 0;
  }

  /* ---------- board ---------- */
  main { max-width: 1040px; margin: 0 auto; padding: 0 16px 48px; }

  .day {
    display: flex; align-items: center; gap: 12px;
    margin: 22px 0 11px;
  }
  .day h2 {
    font-family: "Barlow Condensed", Barlow, sans-serif;
    font-weight: 700; font-size: 19px; letter-spacing: 0.2px;
    margin: 0; color: var(--ink);
  }
  .day .count { font-size: 12px; color: var(--mute); font-weight: 500; }
  .day .rule { flex: 1; height: 1px; background: var(--line); }

  .grid { display: grid; gap: 9px; grid-template-columns: 1fr; }
  @media (min-width: 620px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 940px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }

  .game {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 12px 8px;
  }
  .game.is-live { border-color: rgba(206,17,38,0.45); }

  .head {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; color: var(--mute);
    letter-spacing: 0.5px; text-transform: uppercase;
    padding-bottom: 6px; margin-bottom: 5px;
    border-bottom: 1px solid var(--hair);
  }
  .head .when { margin-left: auto; letter-spacing: 0.2px; text-transform: none; font-weight: 500; }
  .head.live { color: var(--red); }
  .head .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--red);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .2 } }
  @media (prefers-reduced-motion: reduce) { .head .dot { animation: none } }

  .team {
    display: grid; grid-template-columns: 16px 1fr auto 9px;
    align-items: center; gap: 10px;
    padding: 1px 0;
  }
  /* Stands in for the logo ESPN would show. The colour is the school's own,
     so the inset ring keeps very pale schools from vanishing on white. */
  .swatch {
    width: 16px; height: 16px; border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.16);
  }
  .name {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 15px; font-weight: 500; color: var(--mid);
  }
  .pts {
    font-family: "Barlow Condensed", Barlow, sans-serif;
    font-weight: 700; font-size: 21px; line-height: 1;
    font-variant-numeric: tabular-nums; color: var(--mid);
  }
  .caret { width: 9px; }
  .won .name { color: var(--ink); font-weight: 600; }
  .won .pts { color: var(--ink); }
  .won .caret::before {
    content: ""; display: block;
    border: 4.5px solid transparent; border-right-color: var(--ink);
    margin-left: -1px;
  }
  /* Text dims for the losing side, but the swatch does not — dimming a real
     school colour misreports it (Catholic's red turns pink). */
  .lost .name, .lost .pts { color: var(--mute); }

  .msg {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 34px 18px; text-align: center; color: var(--mid); margin-top: 20px;
  }
  .msg b { color: var(--ink); }
  footer { max-width: 1040px; margin: 0 auto; padding: 0 16px 34px; font-size: 12px; color: var(--mute); }
</style>
</head>
<body>

<div class="shell">
  <div class="bar">
    <h1 class="mark">D3 Scores <i>NCAA Division III</i></h1>
    <select id="conf" aria-label="Filter by conference"></select>
  </div>
  <nav class="weeks" id="weeks" aria-label="Week"></nav>
</div>

<main id="board"><p class="msg">Loading scores…</p></main>
<footer id="foot"></footer>

<script src="teams.js"></script>
<script>
// ---------------------------------------------------------------------------
// Where to get the data.
//
// On the real site we call our own proxy with a relative path. When opening
// this file from a local server for testing, that path doesn't exist, so we
// fall back to the deployed proxy — which works because it sends
// Access-Control-Allow-Origin: *.
// ---------------------------------------------------------------------------
const LOCAL = ["localhost", "127.0.0.1", ""].includes(location.hostname);
const API = LOCAL ? "https://d3scores.vercel.app/api/scoreboard" : "/api/scoreboard";

// The API only gives us slugs like "landmark". These are the display names.
// Not from the API — conferenceName comes back empty on every team.
const CONFERENCES = {
  "american-rivers": "American Rivers",
  "asc": "American Southwest",
  "cciw": "CCIW",
  "centennial": "Centennial",
  "cne": "Conference of New England",
  "diii-independent": "Independent",
  "empire-8": "Empire 8",
  "hcac": "HCAC",
  "landmark": "Landmark",
  "liberty-league": "Liberty League",
  "mascac": "MASCAC",
  "miac": "MIAC",
  "michigan-intercol. ath. assn.": "MIAA",
  "middle-atlantic": "Middle Atlantic",
  "mwc": "Midwest Conference",
  "nacc": "NACC",
  "ncac": "NCAC",
  "newmac": "NEWMAC",
  "njac": "NJAC",
  "nwc": "Northwest Conference",
  "oac": "OAC",
  "odac": "ODAC",
  "pac": "PAC",
  "saa": "SAA",
  "scac": "SCAC",
  "sciac": "SCIAC",
  "umac": "UMAC",
  "usa-south": "USA South",
  "wiac": "WIAC",
};

// The 2026 season's week 1 games were played Sep 3-6, so weeks start Aug 31.
const SEASON_START = Date.UTC(2026, 7, 31);   // month 7 = August
const MAX_WEEK = 16;

function currentWeek() {
  const days = Math.floor((Date.now() - SEASON_START) / 86400000);
  return Math.min(MAX_WEEK, Math.max(1, Math.floor(days / 7) + 1));
}

let week = currentWeek();
let conf = "landmark";     // PLAN.md: default the view to Landmark
let games = [];

// Turn text from the API into text that is safe to put in the page.
// Without this, a team name containing < or & could break the markup.
function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function confName(seo) {
  return CONFERENCES[seo] || seo || "Unknown";
}

// A team can list more than one conference; take the first non-empty slug.
function seoOf(side) {
  const list = side.conferences || [];
  for (const c of list) if (c.conferenceSeo) return c.conferenceSeo;
  return "";
}

// Games are grouped under the day they're played. startDate arrives as
// "09/03/2026"; this turns it into "Thursday, Sep 3".
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function groupOf(g) {
  const [m, d, y] = String(g.startDate).split("/").map(Number);
  if (!m || !d || !y) return "Date TBA";
  const dt = new Date(y, m - 1, d);
  return `${DAYS[dt.getDay()]}, ${MONTHS[m - 1]} ${d}`;
}

function hasScore(g) {
  return g.home.score !== "" || g.away.score !== "";
}

// Working out whether a game is done, live, or upcoming is fiddly, because
// gameState lies: some played games still say "pre". Two rules keep it honest:
//   - only treat a game as FINAL when it actually says FINAL
//   - otherwise, if there are scores on the board, it is live
function statusOf(g) {
  const isFinal = g.gameState === "final" ||
                  g.finalMessage === "FINAL" ||
                  g.currentPeriod === "FINAL";
  if (isFinal) return { text: "Final", live: false };

  if (g.gameState === "live" || hasScore(g)) {
    // contestClock is often "0:00" or "00:00" between plays — that's noise, not time.
    const clock = /^0?0:00$/.test(g.contestClock) ? "" : g.contestClock;
    const bits = [g.currentPeriod, clock].filter(Boolean).join(" ");
    return { text: bits || "In progress", live: true };
  }
  return { text: g.startTime || "Scheduled", live: false };
}

// Real school colours, from teams.js. Teams we couldn't harvest (mostly
// non-D3 opponents whose box scores 404) fall back to a neutral grey.
const FALLBACK_COLOR = "#c2c8d1";
function teamColor(seo) {
  return (window.TEAM_COLORS && window.TEAM_COLORS[seo]) || FALLBACK_COLOR;
}

function teamRow(team, opponent, decided) {
  const won = decided && team.winner;
  const lost = decided && opponent.winner && !team.winner;
  return `<div class="team ${won ? "won" : ""} ${lost ? "lost" : ""}">
    <span class="swatch" style="background:${esc(teamColor(team.names.seo))}"></span>
    <span class="name">${esc(team.names.short)}</span>
    <span class="pts">${esc(team.score)}</span>
    <span class="caret"></span>
  </div>`;
}

function gameCard(g) {
  const s = statusOf(g);
  const decided = hasScore(g);
  const conference = seoOf(g.home) && seoOf(g.home) === seoOf(g.away)
    ? confName(seoOf(g.home)) : "";
  return `<article class="game ${s.live ? "is-live" : ""}">
    <div class="head ${s.live ? "live" : ""}">
      ${s.live ? '<span class="dot"></span>' : ""}<span>${esc(s.text)}</span>
      ${conference ? `<span class="when">${esc(conference)}</span>` : ""}
    </div>
    ${teamRow(g.away, g.home, decided)}
    ${teamRow(g.home, g.away, decided)}
  </article>`;
}

function render() {
  const board = document.getElementById("board");

  const shown = conf === "all"
    ? games
    : games.filter(g => seoOf(g.home) === conf || seoOf(g.away) === conf);

  markWeek();

  if (!shown.length) {
    board.innerHTML = `<p class="msg">No <b>${esc(conf === "all" ? "Division III" : confName(conf))}</b> games scheduled in week ${week}.</p>`;
    return;
  }

  // Bucket the games by day. `shown` is already in kickoff order, and a Map
  // keeps insertion order, so the days come out chronologically for free.
  const buckets = new Map();
  for (const g of shown) {
    const k = groupOf(g);
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(g);
  }

  board.innerHTML = [...buckets].map(([day, list]) => `
    <section>
      <div class="day">
        <h2>${esc(day)}</h2>
        <span class="count">${list.length} game${list.length === 1 ? "" : "s"}</span>
        <span class="rule"></span>
      </div>
      <div class="grid">${list.map(gameCard).join("")}</div>
    </section>`).join("");
}

// The week tabs are built once and then only re-flagged. Rebuilding them on
// every refresh would also re-run scrollIntoView, sliding the strip sideways
// under the reader's finger once a minute.
function buildWeeks() {
  document.getElementById("weeks").innerHTML =
    Array.from({ length: MAX_WEEK }, (_, i) => i + 1).map(w =>
      `<button data-week="${w}" aria-current="${w === week}">Week ${w}</button>`).join("");
}

function markWeek({ scroll = false } = {}) {
  for (const b of document.querySelectorAll("#weeks button")) {
    const on = Number(b.dataset.week) === week;
    b.setAttribute("aria-current", String(on));
    if (on && scroll) b.scrollIntoView({ block: "nearest", inline: "center" });
  }
}

function buildConfMenu() {
  const seen = new Set();
  for (const g of games) {
    for (const s of [seoOf(g.home), seoOf(g.away)]) if (s) seen.add(s);
  }
  const opts = [...seen].sort((a, b) => confName(a).localeCompare(confName(b)));
  const sel = document.getElementById("conf");
  sel.innerHTML = `<option value="all">All of Division III</option>` +
    opts.map(s => `<option value="${esc(s)}">${esc(confName(s))}</option>`).join("");
  sel.value = conf;
}

async function load() {
  try {
    const res = await fetch(`${API}?year=2026&week=${String(week).padStart(2, "0")}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    games = (data.games || []).map(x => x.game);
    // The API returns games in no useful order. Sort by kickoff time so the
    // list reads chronologically. startTimeEpoch is seconds, as a string.
    games.sort((a, b) => Number(a.startTimeEpoch) - Number(b.startTimeEpoch));
    buildConfMenu();
    render();
    document.getElementById("foot").textContent =
      "Scores update every minute. Last checked " +
      new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + ".";
  } catch (err) {
    document.getElementById("board").innerHTML =
      `<p class="msg">Scores aren't loading right now.<br>Check your connection and try again. <b>${esc(err.message)}</b></p>`;
  }
}

document.getElementById("conf").addEventListener("change", e => {
  conf = e.target.value;
  render();
});
document.getElementById("weeks").addEventListener("click", e => {
  const btn = e.target.closest("button[data-week]");
  if (!btn) return;
  week = Number(btn.dataset.week);
  markWeek();
  load();
});

buildWeeks();
markWeek({ scroll: true });
load();
setInterval(load, 60000);   // upstream caches for 60s, so refreshing faster is pointless
</script>
</body>
</html>
