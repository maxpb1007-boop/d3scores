<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>D3 Scores — NCAA Division III Football</title>
<meta name="description" content="Live scores, box scores and player leaders for every NCAA Division III football game.">
<!-- Shown when someone pastes a link into a group chat. These are static, so
     every shared link previews the same way; per-game previews would need the
     page to be rendered on the server, which v1 doesn't do. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="D3 Scores">
<meta property="og:title" content="D3 Scores — every Division III football game">
<meta property="og:description" content="Live scores, box scores and player leaders for all of NCAA Division III football.">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page:  #eceef1;
    --card:  #ffffff;
    --line:  #d5dae1;
    --hair:  #eaedf1;
    --ink:   #14171b;
    --mid:   #4f5762;
    --mute:  #8b939e;
    --red:   #c8102e;
    --gold:  #e8a33d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 400 15px/1.4 Barlow, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 3px; }
  /* An explicit display rule beats the browser's default for [hidden], so any
     flex container would ignore the attribute without this. */
  [hidden] { display: none !important; }

  /* ---------------- masthead ---------------- */
  .shell { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 16px 9px; }

  .mark { margin: 0; display: flex; align-items: center; gap: 8px; flex: none; }
  .mark .d3 {
    background: var(--red); color: #fff;
    font-family: "Barlow Condensed", Barlow, sans-serif; font-weight: 700;
    font-size: 17px; line-height: 1; letter-spacing: 0.5px;
    padding: 6px 7px 5px; border-radius: 4px;
  }
  .mark .word {
    font-family: "Barlow Condensed", Barlow, sans-serif;
    font-weight: 700; font-size: 24px; line-height: 1; letter-spacing: 0.3px;
  }

  select {
    min-width: 0; max-width: 210px;
    font: 500 13px Barlow, sans-serif; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    height: 33px; padding: 0 27px 0 10px; appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='11' viewBox='0 0 12 12'><path d='M2 4.5l4 4 4-4' fill='none' stroke='%234f5762' stroke-width='1.7' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat; background-position: right 9px center;
  }

  /* Primary view nav. Sits above the week strip so the masthead stays uncrowded. */
  .views {
    max-width: 1080px; margin: 0 auto; display: flex; gap: 2px;
    padding: 0 8px; overflow-x: auto; scrollbar-width: none;
    border-bottom: 1px solid var(--hair);
  }
  .views::-webkit-scrollbar { display: none; }
  .views button {
    flex: none; background: none; border: 0; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
    font: 700 12px Barlow, sans-serif; letter-spacing: 0.5px; text-transform: uppercase;
    color: var(--mute); padding: 9px 11px 10px; position: relative;
  }
  .views button[aria-current="true"] { color: var(--ink); }
  .views button[aria-current="true"]::after {
    content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--ink);
  }
  .views button.hot { color: var(--red); }
  .views .livedot { width: 7px; height: 7px; border-radius: 50%; background: var(--mute); }
  .views button.hot .livedot { background: var(--red); animation: pulse 1.6s ease-in-out infinite; }
  .views button[data-view="live"][aria-current="true"]::after { background: var(--red); }
  @media (prefers-reduced-motion: reduce) { .views .livedot { animation: none; } }

  /* ---------------- schedule strength ---------------- */
  .sostools { display: flex; align-items: center; gap: 8px; margin: 16px 0 0; flex-wrap: wrap; }
  .sostools select { max-width: 150px; }
  table.sos { width: 100%; border-collapse: collapse; margin-top: 10px; }
  table.sos th {
    font-size: 10px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--mute);
    font-weight: 700; text-align: right; padding: 0 6px 7px;
  }
  table.sos th:nth-child(1), table.sos th:nth-child(2) { text-align: left; }
  table.sos td { padding: 8px 6px; border-top: 1px solid var(--hair); font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; }
  table.sos td:nth-child(1) { text-align: left; color: var(--mute); font-size: 12px; width: 32px; }
  table.sos td:nth-child(2) { text-align: left; }
  table.sos .tm { display: flex; align-items: center; gap: 8px; min-width: 0; }
  table.sos .tm .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  table.sos .tm .cf { color: var(--mute); font-size: 11px; }
  table.sos .val { font-weight: 700; }
  .warn {
    background: #fff8e6; border: 1px solid #f0dca8; color: #6b5416;
    border-radius: 7px; padding: 11px 13px; font-size: 13px; margin-top: 14px;
  }
  .warn b { font-weight: 700; }

  /* ---------------- redzone ---------------- */
  .rz { display: grid; gap: 10px; grid-template-columns: 1fr; margin-top: 16px; }
  @media (min-width: 640px) { .rz { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 960px) { .rz { grid-template-columns: 1fr 1fr 1fr; } }

  .rzg {
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--red);
    border-radius: 7px; padding: 10px 12px 11px; cursor: pointer; position: relative;
  }
  .rzg .rzhead {
    display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700;
    letter-spacing: 0.7px; text-transform: uppercase; color: var(--red);
    padding-bottom: 7px; margin-bottom: 7px; border-bottom: 1px solid var(--hair);
  }
  .rzg .rzhead .conf { margin-left: auto; color: var(--mute); font-weight: 500; letter-spacing: 0.2px; text-transform: none; }
  .rzg .team { grid-template-columns: 14px 1fr auto auto; }
  .rzg .pts { font-size: 26px; }
  .rzg .delta {
    font: 700 11px Barlow, sans-serif; color: #fff; background: var(--red);
    border-radius: 10px; padding: 2px 7px; margin-left: 8px; white-space: nowrap;
  }
  .rzg .margin { font-size: 11px; color: var(--mute); margin-top: 8px; }

  .weeks { max-width: 1080px; margin: 0 auto; display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; padding: 0 8px; }
  .weeks::-webkit-scrollbar { display: none; }
  .weeks button {
    flex: none; background: none; border: 0; cursor: pointer;
    font: 600 13px Barlow, sans-serif; color: var(--mid);
    padding: 8px 12px 10px; position: relative; white-space: nowrap;
  }
  .weeks button[aria-current="true"] { color: var(--ink); }
  .weeks button[aria-current="true"]::after {
    content: ""; position: absolute; left: 9px; right: 9px; bottom: 0;
    height: 3px; background: var(--red);
  }

  /* ---------------- board ---------------- */
  main { max-width: 1080px; margin: 0 auto; padding: 0 16px 48px; }

  .group { margin-top: 20px; }
  .group > header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 9px; }
  .group h2 {
    font-family: "Barlow Condensed", Barlow, sans-serif;
    font-weight: 700; font-size: 20px; letter-spacing: 0.2px; margin: 0;
  }
  .group .n { font-size: 12px; color: var(--mute); font-weight: 500; }
  .group .rule { flex: 1; height: 1px; background: var(--line); align-self: center; }
  .group.pinned h2 { color: var(--red); }

  .grid { display: grid; gap: 8px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 960px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }

  .game { background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 8px 6px 8px 12px; }
  .game.is-live { border-color: var(--red); }

  .head {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; font-weight: 700; color: var(--mute);
    letter-spacing: 0.9px; text-transform: uppercase;
    padding: 0 6px 7px 0; margin-bottom: 6px; border-bottom: 1px solid var(--hair);
  }
  .head .side { margin-left: auto; font-weight: 500; letter-spacing: 0.3px; text-transform: none; font-size: 11px; }
  .head.live { color: var(--red); }
  .head .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .2 } }
  @media (prefers-reduced-motion: reduce) { .head .dot { animation: none } }

  .team { display: grid; grid-template-columns: 14px 1fr auto 10px 26px; align-items: center; gap: 9px; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18); }
  .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 500; color: var(--mid); }
  .pts {
    font-family: "Barlow Condensed", Barlow, sans-serif; font-weight: 700;
    font-size: 23px; line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--mid);
  }
  .caret { width: 10px; }
  .won .name { color: var(--ink); font-weight: 600; }
  .won .pts { color: var(--ink); }
  .won .caret::before { content: ""; display: block; border: 5px solid transparent; border-right-color: var(--ink); margin-left: -2px; }
  /* Text dims for the losing side, but the swatch does not — dimming a real
     school colour misreports it (Catholic's red would read as pink). */
  .lost .name, .lost .pts { color: var(--mute); }

  .fav {
    width: 26px; height: 26px; padding: 0; border: 0; background: none; cursor: pointer;
    display: grid; place-items: center; color: #ccd2da;
  }
  .fav svg { display: block; }
  .fav[aria-pressed="true"] { color: var(--gold); }
  @media (hover: hover) { .fav:hover { color: var(--mid); } .fav[aria-pressed="true"]:hover { color: var(--gold); } }

  /* ---------------- game detail ---------------- */
  dialog#detail {
    padding: 0; border: 0; background: var(--card); color: var(--ink);
    width: 100%; max-width: 100%; height: 100%; max-height: 100%; margin: 0;
  }
  dialog#detail::backdrop { background: rgba(12,15,20,0.55); }
  @media (min-width: 700px) {
    dialog#detail {
      width: 620px; max-width: calc(100vw - 40px);
      height: auto; max-height: calc(100vh - 80px);
      margin: auto; border-radius: 10px; overflow: hidden;
    }
  }
  .sheet { display: flex; flex-direction: column; height: 100%; max-height: inherit; }
  .sheet:focus { outline: none; }   /* it's focused on open only to park focus inside */

  .sheet > header { padding: 12px 14px 12px; border-bottom: 1px solid var(--line); flex: none; }
  .sheet .top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .sheet .kicker { font-size: 10px; font-weight: 700; letter-spacing: 0.9px; text-transform: uppercase; color: var(--mute); }
  .sheet .kicker.live { color: var(--red); }
  .sheet .close {
    width: 32px; height: 32px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--mid);
    font-size: 17px; line-height: 1; cursor: pointer;
  }
  .sheet #shareDetail { margin-left: auto; }
  .sheet .toast {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 22px; background: var(--ink); color: #fff;
    font-size: 13px; padding: 8px 14px; border-radius: 20px; z-index: 3;
  }
  .sheet .side { display: grid; grid-template-columns: 16px 1fr auto; gap: 10px; align-items: center; }
  .sheet .side + .side { margin-top: 5px; }
  .sheet .side .nm { font-size: 17px; font-weight: 500; color: var(--mid); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet .side .sc { font-family: "Barlow Condensed", Barlow, sans-serif; font-weight: 700; font-size: 27px; line-height: 1; color: var(--mid); font-variant-numeric: tabular-nums; }
  .sheet .side.w .nm { color: var(--ink); font-weight: 600; }
  .sheet .side.w .sc { color: var(--ink); }

  .sheet .body { overflow-y: auto; padding: 4px 14px 22px; -webkit-overflow-scrolling: touch; }
  .sheet h3 {
    font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--mute); margin: 20px 0 8px;
  }

  table.line { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.line th, table.line td { padding: 5px 4px; text-align: center; font-size: 13px; }
  table.line th { font-size: 10px; letter-spacing: 0.7px; color: var(--mute); font-weight: 700; }
  table.line th:first-child, table.line td:first-child { text-align: left; }
  table.line td.tot { font-weight: 700; color: var(--ink); }
  table.line tbody tr + tr td { border-top: 1px solid var(--hair); }

  .plays { display: grid; gap: 0; }
  .qhead { font-size: 11px; font-weight: 700; color: var(--mid); padding: 9px 0 5px; border-bottom: 1px solid var(--hair); }
  .play { display: grid; grid-template-columns: 14px 40px 1fr; gap: 9px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--hair); font-size: 13px; }
  .play .clock { color: var(--mute); font-size: 12px; font-variant-numeric: tabular-nums; }
  .play .txt { color: var(--mid); }
  .play .sw { width: 10px; height: 10px; border-radius: 2px; align-self: center; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18); }

  table.cmp { width: 100%; border-collapse: collapse; }
  table.cmp td { padding: 7px 4px; font-size: 13px; border-top: 1px solid var(--hair); font-variant-numeric: tabular-nums; }
  table.cmp td.lbl { text-align: center; color: var(--mute); font-size: 11px; }
  table.cmp td.a { text-align: left; font-weight: 600; }
  table.cmp td.h { text-align: right; font-weight: 600; }

  .leaders { display: grid; gap: 14px; }
  @media (min-width: 560px) { .leaders { grid-template-columns: 1fr 1fr; } }
  .ldr .who { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
  .ldr .row { display: grid; grid-template-columns: 54px 1fr; gap: 8px; font-size: 13px; padding: 4px 0; border-top: 1px solid var(--hair); }
  .ldr .cat { color: var(--mute); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; padding-top: 2px; }
  .ldr .val { color: var(--mid); }
  .ldr .val b { color: var(--ink); font-weight: 600; }
  .note { font-size: 12px; color: var(--mute); margin: 8px 0 0; }

  .game { cursor: pointer; }
  @media (hover: hover) { .game:hover { border-color: #b9c1cc; } }

  /* ---------------- followed players ---------------- */
  .pcard { background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 9px 12px 10px; }
  .pcard .ph { display: grid; grid-template-columns: 14px 1fr auto; gap: 9px; align-items: center; }
  .pcard .pn { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcard .pn .no { color: var(--mute); font-weight: 500; }
  .pcard .drop {
    width: 26px; height: 26px; padding: 0; border: 0; background: none; cursor: pointer;
    color: var(--gold); display: grid; place-items: center;
  }
  .pcard .ctx { font-size: 11px; color: var(--mute); margin: 6px 0 0; letter-spacing: 0.2px; }
  .pcard .stat { display: grid; grid-template-columns: 46px 1fr; gap: 8px; font-size: 13px; padding: 5px 0 0; }
  .pcard .stat .cat { color: var(--mute); font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; padding-top: 3px; }
  .pcard .stat .val { color: var(--mid); }
  .pcard .stat .val b { color: var(--ink); font-weight: 600; }
  .pcard.quiet .ctx { color: var(--mute); }

  .ldr .row { position: relative; }
  .ldr .follow {
    width: 24px; height: 24px; padding: 0; border: 0; background: none; cursor: pointer;
    color: #ccd2da; display: grid; place-items: center;
  }
  .ldr .follow[aria-pressed="true"] { color: var(--gold); }
  .ldr .row { grid-template-columns: 54px 1fr 24px; }

  .msg { background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 32px 18px; text-align: center; color: var(--mid); margin-top: 20px; }
  .msg b { color: var(--ink); font-weight: 600; }
  .msg .hint { display: block; margin-top: 6px; font-size: 13px; color: var(--mute); }
  footer { max-width: 1080px; margin: 0 auto; padding: 4px 16px 34px; font-size: 12px; color: var(--mute); }
</style>
</head>
<body>

<div class="shell">
  <div class="bar">
    <h1 class="mark"><span class="d3">D3</span><span class="word">Scores</span></h1>
    <select id="conf" aria-label="Filter by conference"></select>
  </div>
  <nav class="views" id="views" aria-label="View">
    <button data-view="scores" aria-current="true">Scores</button>
    <button data-view="live"><span class="livedot"></span><span id="liveLabel">Live</span></button>
    <button data-view="sos">Schedule strength</button>
  </nav>
  <nav class="weeks" id="weeks" aria-label="Week"></nav>
</div>

<main>
  <div id="players"></div>
  <div id="board"><p class="msg">Loading scores…</p></div>
</main>
<footer id="foot"></footer>

<dialog id="detail" aria-label="Game detail"></dialog>

<script src="teams.js"></script>
<script>
// ---------------------------------------------------------------------------
// Where to get the data.
//
// On the real site we call our own proxy with a relative path. Locally we call
// the dev server on port 8000, which runs the same api/*.js handlers, so local
// testing exercises the real code rather than a stand-in.
// ---------------------------------------------------------------------------
const LOCAL = ["localhost", "127.0.0.1", ""].includes(location.hostname);
const API = LOCAL ? "http://localhost:8000/api/scoreboard" : "/api/scoreboard";
const GAME_API = LOCAL ? "http://localhost:8000/api/game" : "/api/game";
const SEASON_API = LOCAL ? "http://localhost:8000/api/season" : "/api/season";

// The API only gives us slugs like "landmark". These are the display names.
// Not from the API — conferenceName comes back empty on every team.
const CONFERENCES = {
  "american-rivers": "American Rivers",
  "asc": "American Southwest",
  "cciw": "CCIW",
  "centennial": "Centennial",
  "cne": "Conference of New England",
  "diii-independent": "Independent",
  "empire-8": "Empire 8",
  "hcac": "HCAC",
  "landmark": "Landmark",
  "liberty-league": "Liberty League",
  "mascac": "MASCAC",
  "miac": "MIAC",
  "michigan-intercol. ath. assn.": "MIAA",
  "middle-atlantic": "Middle Atlantic",
  "mwc": "Midwest Conference",
  "nacc": "NACC",
  "ncac": "NCAC",
  "newmac": "NEWMAC",
  "njac": "NJAC",
  "nwc": "Northwest Conference",
  "oac": "OAC",
  "odac": "ODAC",
  "pac": "PAC",
  "saa": "SAA",
  "scac": "SCAC",
  "sciac": "SCIAC",
  "umac": "UMAC",
  "usa-south": "USA South",
  "wiac": "WIAC",
};

// The 2026 season's week 1 games were played Sep 3-6, so weeks start Aug 31.
const SEASON_START = Date.UTC(2026, 7, 31);   // month 7 = August
const MAX_WEEK = 16;

function currentWeek() {
  const days = Math.floor((Date.now() - SEASON_START) / 86400000);
  return Math.min(MAX_WEEK, Math.max(1, Math.floor(days / 7) + 1));
}

// ---------------------------------------------------------------------------
// The URL is the app's state, so any view can be sent to someone else:
//   ?week=1&conf=landmark          a week and a conference
//   ?week=1&game=6606156           a specific game's box score
// Without this there is nothing to share, and word of mouth is the only
// distribution this site will ever have.
// ---------------------------------------------------------------------------
const startParams = new URLSearchParams(location.search);

function readWeek() {
  const w = Number(startParams.get("week"));
  return Number.isInteger(w) && w >= 1 && w <= MAX_WEEK ? w : currentWeek();
}

let week = readWeek();
let conf = startParams.get("conf") || "landmark";   // PLAN.md: default to Landmark
let games = [];
let pendingGame = startParams.get("game");          // opened once games have loaded

// Midweek, the current week's games haven't been played, so opening the site
// shows a scoreboard with no scores on it. Unless the reader asked for a
// specific week, fall back once to the last week that actually has results.
let weekWasChosen = startParams.has("week");
let triedFallback = false;
const VIEWS = ["scores", "live", "sos"];
let view = VIEWS.includes(startParams.get("view")) ? startParams.get("view") : "scores";
let sosYear = startParams.get("season") || "2026";

function viewUrl(gameID) {
  const p = new URLSearchParams();
  p.set("week", String(week));
  if (conf && conf !== "favourites") p.set("conf", conf);
  if (view !== "scores") p.set("view", view);
  if (view === "sos" && sosYear !== "2026") p.set("season", sosYear);
  if (gameID) p.set("game", String(gameID));
  return location.pathname + "?" + p.toString();
}

function syncUrl() {
  history.replaceState(history.state, "", viewUrl(null));
}

// --- favourite teams -------------------------------------------------------
// Stored in the browser only. No accounts, no server, nothing to leak. Private
// browsing can make localStorage throw, so every access is guarded.
const FAV_KEY = "d3scores.favourites";

function loadFavs() {
  try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY)) || []); }
  catch { return new Set(); }
}
function saveFavs() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); }
  catch { /* storage unavailable; favourites just won't survive a reload */ }
}
let favs = loadFavs();

const isFavTeam = (seo) => favs.has(seo);
const isFavGame = (g) => isFavTeam(g.home.names.seo) || isFavTeam(g.away.names.seo);

// --- followed players ------------------------------------------------------
// The API gives players no stable id — just a name and (sometimes) a jersey
// number, repeated per game. So the key is team + surname + forename. Jersey
// numbers are deliberately not part of the key: they are null on some players
// and can change between seasons.
const PLAYER_KEY = "d3scores.players";

function playerKey(teamSeo, p) {
  return [teamSeo, String(p.lastName || "").toUpperCase(), String(p.firstName || "").toUpperCase()].join("|");
}
function loadPlayers() {
  try { return new Map(JSON.parse(localStorage.getItem(PLAYER_KEY)) || []); }
  catch { return new Map(); }
}
function savePlayers() {
  try { localStorage.setItem(PLAYER_KEY, JSON.stringify([...players])); }
  catch { /* storage unavailable; follows just won't survive a reload */ }
}
let players = loadPlayers();

// Turn text from the API into text that is safe to put in the page.
// Without this, a team name containing < or & could break the markup.
function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function confName(seo) { return CONFERENCES[seo] || seo || "Unknown"; }

// A team can list more than one conference; take the first non-empty slug.
function seoOf(side) {
  for (const c of side.conferences || []) if (c.conferenceSeo) return c.conferenceSeo;
  return "";
}

// Real school colours, from teams.js. Teams we couldn't harvest (mostly
// non-D3 opponents whose box scores 404) fall back to a neutral grey.
const FALLBACK_COLOR = "#c2c8d1";
function teamColor(seo) {
  return (window.TEAM_COLORS && window.TEAM_COLORS[seo]) || FALLBACK_COLOR;
}

// Games are grouped under the day they're played. startDate arrives as
// "09/03/2026"; this turns it into "Thursday, Sep 3".
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function dayOf(g) {
  const [m, d, y] = String(g.startDate).split("/").map(Number);
  if (!m || !d || !y) return "Date TBA";
  return `${DAYS[new Date(y, m - 1, d).getDay()]}, ${MONTHS[m - 1]} ${d}`;
}
function shortDayOf(g) {
  const [m, d, y] = String(g.startDate).split("/").map(Number);
  if (!m || !d || !y) return "";
  return `${DAYS[new Date(y, m - 1, d).getDay()].slice(0, 3)} ${MONTHS[m - 1]} ${d}`;
}

function hasScore(g) { return g.home.score !== "" || g.away.score !== ""; }

// Working out whether a game is done, live, or upcoming is fiddly, because
// gameState lies: some played games still say "pre". Two rules keep it honest:
//   - only treat a game as FINAL when it actually says FINAL
//   - otherwise, if there are scores on the board, it is live
function statusOf(g) {
  const isFinal = g.gameState === "final" || g.finalMessage === "FINAL" || g.currentPeriod === "FINAL";
  if (isFinal) return { text: "Final", live: false };
  if (g.gameState === "live" || hasScore(g)) {
    // contestClock is often "0:00" or "00:00" between plays — noise, not time.
    const clock = /^0?0:00$/.test(g.contestClock) ? "" : g.contestClock;
    return { text: [g.currentPeriod, clock].filter(Boolean).join(" ") || "In progress", live: true };
  }
  return { text: g.startTime || "Scheduled", live: false };
}

const STAR = `<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 3.9l2.47 5.01 5.53.8-4 3.9.94 5.5L12 16.51 7.06 19.1l.94-5.5-4-3.9 5.53-.8z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const STAR_OFF = `<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 3.9l2.47 5.01 5.53.8-4 3.9.94 5.5L12 16.51 7.06 19.1l.94-5.5-4-3.9 5.53-.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>`;

function teamRow(team, opponent, decided) {
  const seo = team.names.seo;
  const won = decided && team.winner;
  const lost = decided && opponent.winner && !team.winner;
  const fav = isFavTeam(seo);
  return `<div class="team ${won ? "won" : ""} ${lost ? "lost" : ""}">
    <span class="swatch" style="background:${esc(teamColor(seo))}"></span>
    <span class="name">${esc(team.names.short)}</span>
    <span class="pts">${esc(team.score)}</span>
    <span class="caret"></span>
    <button class="fav" data-seo="${esc(seo)}" aria-pressed="${fav}"
      aria-label="${fav ? "Remove" : "Add"} ${esc(team.names.short)} ${fav ? "from" : "to"} your teams"
      title="${fav ? "Remove from" : "Add to"} your teams">${fav ? STAR : STAR_OFF}</button>
  </div>`;
}

function gameCard(g, { showDay = false } = {}) {
  const s = statusOf(g);
  const decided = hasScore(g);
  const side = showDay
    ? shortDayOf(g)
    : (seoOf(g.home) && seoOf(g.home) === seoOf(g.away) ? confName(seoOf(g.home)) : "");
  return `<article class="game ${s.live ? "is-live" : ""}" data-game="${esc(g.gameID)}"
      tabindex="0" role="button"
      aria-label="${esc(g.away.names.short)} at ${esc(g.home.names.short)}, open box score">
    <div class="head ${s.live ? "live" : ""}">
      ${s.live ? '<span class="dot"></span>' : ""}<span>${esc(s.text)}</span>
      ${side ? `<span class="side">${esc(side)}</span>` : ""}
    </div>
    ${teamRow(g.away, g.home, decided)}
    ${teamRow(g.home, g.away, decided)}
  </article>`;
}

function section(title, list, { pinned = false, showDay = false } = {}) {
  return `<section class="group ${pinned ? "pinned" : ""}">
    <header>
      <h2>${esc(title)}</h2>
      <span class="n">${list.length} game${list.length === 1 ? "" : "s"}</span>
      <span class="rule"></span>
    </header>
    <div class="grid">${list.map(g => gameCard(g, { showDay })).join("")}</div>
  </section>`;
}

function render() {
  const board = document.getElementById("board");
  markWeek();
  updateNav();

  if (view === "sos") { renderSos(); return; }
  if (view === "live") { renderRedzone(); return; }

  let shown = games;
  if (conf === "favourites") shown = games.filter(isFavGame);
  else if (conf !== "all") shown = games.filter(g => seoOf(g.home) === conf || seoOf(g.away) === conf);

  if (!shown.length) {
    board.innerHTML = conf === "favourites"
      ? `<p class="msg">None of <b>your teams</b> play in week ${week}.
           <span class="hint">Pick another week above, or choose a conference to follow more teams.</span></p>`
      : `<p class="msg">No <b>${esc(conf === "all" ? "Division III" : confName(conf))}</b> games in week ${week}.
           <span class="hint">Try another week above.</span></p>`;
    return;
  }

  // Favourites ride at the top, and are taken out of the day groups below so
  // no game appears twice.
  const pinned = conf === "favourites" ? [] : shown.filter(isFavGame);
  const rest = pinned.length ? shown.filter(g => !isFavGame(g)) : shown;

  // `rest` is already in kickoff order and a Map keeps insertion order, so the
  // days come out chronologically for free.
  const byDay = new Map();
  for (const g of rest) {
    const k = dayOf(g);
    if (!byDay.has(k)) byDay.set(k, []);
    byDay.get(k).push(g);
  }

  board.innerHTML =
    (pinned.length ? section("Your teams", pinned, { pinned: true, showDay: true }) : "") +
    [...byDay].map(([day, list]) => section(day, list)).join("");
}

// ---------------------------------------------------------------------------
// RedZone: one screen of everything currently in progress, across all of D3.
//
// Score changes are found by diffing each 60s poll against the last one and
// held in memory — there is no "recent scoring" field in the API, and this
// needs no storage.
// ---------------------------------------------------------------------------
const lastScores = new Map();     // gameID -> { h, a } from the previous poll
const scoreDeltas = new Map();    // gameID -> { h, a, at } since the last change
const DELTA_LIFE = 4 * 60 * 1000; // how long a "+7" badge stays up

function isLive(g) {
  const s = statusOf(g);
  return s.live;
}

function trackScores(list) {
  for (const g of list) {
    const id = String(g.gameID);
    const h = num(g.home.score), a = num(g.away.score);
    const prev = lastScores.get(id);
    // The first poll only establishes a baseline; a delta needs two readings.
    if (prev && (h !== prev.h || a !== prev.a)) {
      scoreDeltas.set(id, { h: h - prev.h, a: a - prev.a, at: Date.now() });
    }
    lastScores.set(id, { h, a });
  }
}

function freshDelta(gameID) {
  const d = scoreDeltas.get(String(gameID));
  if (!d) return null;
  if (Date.now() - d.at > DELTA_LIFE) { scoreDeltas.delete(String(gameID)); return null; }
  return d;
}

function rzTeamRow(team, opponent, delta) {
  const lead = num(team.score) > num(opponent.score);
  return `<div class="team ${lead ? "won" : ""}">
    <span class="swatch" style="background:${esc(teamColor(team.names.seo))}"></span>
    <span class="name">${esc(team.names.short)}</span>
    <span class="pts">${esc(team.score || "0")}</span>
    ${delta ? `<span class="delta">+${delta}</span>` : "<span></span>"}
  </div>`;
}

function rzCard(g) {
  const s = statusOf(g);
  const d = freshDelta(g.gameID);
  const conference = seoOf(g.home) && seoOf(g.home) === seoOf(g.away) ? confName(seoOf(g.home)) : "";
  const margin = Math.abs(num(g.home.score) - num(g.away.score));
  const marginText = margin === 0 ? "Tied" : `${margin} point${margin === 1 ? "" : "s"}`;
  return `<article class="rzg" data-game="${esc(g.gameID)}" tabindex="0" role="button"
      aria-label="${esc(g.away.names.short)} at ${esc(g.home.names.short)}, open box score">
    <div class="rzhead">
      <span class="dot" style="width:6px;height:6px;border-radius:50%;background:var(--red);display:inline-block"></span>
      <span>${esc(s.text)}</span>
      ${conference ? `<span class="conf">${esc(conference)}</span>` : ""}
    </div>
    ${rzTeamRow(g.away, g.home, d && d.a > 0 ? d.a : 0)}
    ${rzTeamRow(g.home, g.away, d && d.h > 0 ? d.h : 0)}
    <p class="margin">${marginText}</p>
  </article>`;
}

function renderRedzone() {
  const board = document.getElementById("board");
  document.getElementById("players").innerHTML = "";

  // RedZone deliberately ignores the conference filter — the whole point is
  // every game at once.
  const live = games.filter(isLive);

  if (!live.length) {
    const next = games.filter(g => !hasScore(g)).sort((x, y) => num(x.startTimeEpoch) - num(y.startTimeEpoch))[0];
    board.innerHTML = `<p class="msg">Nothing is in progress right now.
      <span class="hint">${next
        ? `Next kickoff is ${esc(next.away.names.short)} at ${esc(next.home.names.short)}, ${esc(shortDayOf(next))} ${esc(next.startTime || "")}.`
        : `No games left to play in week ${week}.`}</span></p>`;
    return;
  }

  // Closest games first — that's what a RedZone screen is for.
  const sorted = [...live].sort((x, y) => {
    const mx = Math.abs(num(x.home.score) - num(x.away.score));
    const my = Math.abs(num(y.home.score) - num(y.away.score));
    if (mx !== my) return mx - my;
    return num(y.startTimeEpoch) - num(x.startTimeEpoch);
  });

  board.innerHTML = `
    <section class="group pinned">
      <header>
        <h2>In progress</h2>
        <span class="n">${live.length} game${live.length === 1 ? "" : "s"}${live.length > 1 ? " · closest first" : ""} · all of D3</span>
        <span class="rule"></span>
      </header>
      <div class="rz">${sorted.map(rzCard).join("")}</div>
    </section>`;
}

function updateNav() {
  const n = games.filter(isLive).length;
  for (const b of document.querySelectorAll("#views button")) {
    b.setAttribute("aria-current", String(b.dataset.view === view));
    if (b.dataset.view === "live") b.classList.toggle("hot", n > 0);
  }
  document.getElementById("liveLabel").textContent = n ? `Live ${n}` : "Live";
  // Week tabs are meaningless on a season-long table; the conference filter
  // doesn't apply to RedZone, which deliberately shows the whole division.
  document.getElementById("weeks").hidden = view === "sos";
  document.getElementById("conf").hidden = view === "live";
}

// ---------------------------------------------------------------------------
// Strength of schedule. Computed by api/season.js from every result of the
// season, because the upstream /standings endpoint returns 500.
// ---------------------------------------------------------------------------
const seasonCache = new Map();

function getSeason(year) {
  if (!seasonCache.has(year)) {
    seasonCache.set(year, fetch(`${SEASON_API}?year=${encodeURIComponent(year)}`)
      .then(r => (r.ok ? r.json() : null))
      .catch(() => null));
  }
  return seasonCache.get(year);
}

const fmt3 = (n) => n.toFixed(3).replace(/^0\./, ".");

async function renderSos() {
  const board = document.getElementById("board");
  document.getElementById("players").innerHTML = "";

  const tools = `<div class="sostools">
      <select id="sosYear" aria-label="Season">
        ${["2026", "2025", "2024"].map(y =>
          `<option value="${y}"${y === sosYear ? " selected" : ""}>${y}${y === "2026" ? " (current)" : ""}</option>`).join("")}
      </select>
    </div>`;

  board.innerHTML = tools + `<p class="msg">Working out every team's schedule…</p>`;

  const season = await getSeason(sosYear);
  if (!season || !season.data) {
    board.innerHTML = tools + `<p class="msg">Couldn't build the schedule table.<span class="hint">Try again in a moment.</span></p>`;
    return;
  }

  let rows = season.data;
  if (conf === "favourites") rows = rows.filter(t => favs.has(t.seo));
  else if (conf !== "all") rows = rows.filter(t => t.conf === conf);

  // With only a week or two played, every opponent's record outside the head-to-head
  // is empty, so the number is genuinely undefined rather than low.
  const usable = rows.filter(t => t.sos > 0).length;
  const notes = [];
  if (season.weeksFailed) {
    notes.push(`<div class="warn"><b>Incomplete.</b> ${season.weeksFailed} week${season.weeksFailed === 1 ? "" : "s"} of results failed to load, so these records are missing games.</div>`);
  }
  if (!usable) {
    notes.push(`<div class="warn"><b>Too early to mean anything.</b> Strength of schedule compares your opponents' records against everyone <em>else</em> they played. After ${season.weeksWithResults} week${season.weeksWithResults === 1 ? "" : "s"}, nobody has played anyone else yet, so there is nothing to compare. It starts working around week 4 — until then, try a past season below.</div>`);
  } else if (season.weeksWithResults < 4) {
    notes.push(`<div class="warn"><b>Early days.</b> Based on ${season.weeksWithResults} week${season.weeksWithResults === 1 ? "" : "s"} of results, so expect these to move a lot.</div>`);
  }

  const table = !usable ? "" : `
    <table class="sos">
      <thead><tr><th></th><th>Team</th><th>Rec</th><th>SoS</th><th>Opp&nbsp;W%</th></tr></thead>
      <tbody>
        ${rows.map((t, i) => `<tr>
          <td>${i + 1}</td>
          <td><span class="tm">
            <span class="swatch" style="background:${esc(teamColor(t.seo))}"></span>
            <span class="nm">${esc(t.name)}</span>
          </span><span class="cf">${esc(confName(t.conf))}</span></td>
          <td>${t.w}-${t.l}${t.t ? "-" + t.t : ""}</td>
          <td class="val">${fmt3(t.sos)}</td>
          <td>${fmt3(t.owp)}</td>
        </tr>`).join("")}
      </tbody>
    </table>`;

  const heading = `<section class="group">
      <header>
        <h2>Schedule strength</h2>
        <span class="n">${rows.length} team${rows.length === 1 ? "" : "s"} · ${season.gamesCounted} games</span>
        <span class="rule"></span>
      </header>
    </section>`;

  board.innerHTML = tools + heading + notes.join("") +
    (rows.length ? table : `<p class="msg">No teams match that filter.</p>`) +
    `<p class="note" style="padding:16px 2px 0">Hardest schedule first. SoS weights your opponents' records twice as heavily as their opponents' records, and ignores games against teams outside Division III. Games against you are taken out of your opponents' records, so beating someone doesn't drag your own number down.</p>`;
}

// ---------------------------------------------------------------------------
// Game detail: line score, scoring plays, team stats, leaders.
// ---------------------------------------------------------------------------
const dlg = document.getElementById("detail");

// Points per scoring type, used to rebuild a quarter-by-quarter line score.
// The API's own running-score fields are all zeroes, so the line score has to
// be derived. TPC is a two-point conversion.
const POINTS = { TD: 6, XP: 1, FG: 3, SAF: 2, TPC: 2, "2PT": 2, "2XP": 2 };

const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };

function periodLabel(title, i) {
  const m = String(title).match(/^(\d)/);
  if (m) return m[1];
  return /ot|overtime/i.test(title) ? "OT" : String(i + 1);
}

// Rebuild each team's points per quarter. Returns valid:false when the rebuilt
// total disagrees with the real final — which happens, because some games are
// missing a scoring play entirely (Trine, week 1: six points unaccounted for).
function lineScore(summary) {
  if (!summary || !summary.periods || !summary.teams) return null;
  const rows = {};
  for (const t of summary.teams) rows[String(t.teamId)] = { team: t, cells: [], total: num(t.score) };
  summary.periods.forEach((p, i) => {
    for (const k in rows) rows[k].cells[i] = 0;
    for (const s of p.summary || []) {
      const r = rows[String(s.teamId)];
      if (r) r.cells[i] += POINTS[s.scoreType] ?? 0;
    }
  });
  const valid = Object.values(rows).every(r => r.cells.reduce((a, b) => a + b, 0) === r.total);
  const labels = summary.periods.map((p, i) => periodLabel(p.title, i));
  return { rows, labels, valid };
}

function sideOf(list, home) {
  return (list || []).find(t => Boolean(t.isHome) === home);
}

function lineScoreHTML(ls) {
  if (!ls) return "";
  const away = sideOf(Object.values(ls.rows).map(r => r.team), false);
  const home = sideOf(Object.values(ls.rows).map(r => r.team), true);
  const order = [away, home].filter(Boolean);
  if (order.length !== 2) return "";

  if (!ls.valid) {
    return `<h3>Score</h3>
      <table class="line"><tbody>
        ${order.map(t => `<tr><td>${esc(t.nameShort)}</td><td class="tot">${num(t.score)}</td></tr>`).join("")}
      </tbody></table>
      <p class="note">Quarter-by-quarter detail isn't available for this game — the scoring feed is missing at least one play, so the quarters wouldn't add up to the final.</p>`;
  }

  return `<h3>Line score</h3>
    <table class="line">
      <thead><tr><th></th>${ls.labels.map(l => `<th>${esc(l)}</th>`).join("")}<th>T</th></tr></thead>
      <tbody>
        ${order.map(t => {
          const r = ls.rows[String(t.teamId)];
          return `<tr><td>${esc(t.nameShort)}</td>${r.cells.map(c => `<td>${c}</td>`).join("")}<td class="tot">${r.total}</td></tr>`;
        }).join("")}
      </tbody>
    </table>`;
}

function playsHTML(summary) {
  if (!summary || !summary.periods) return "";
  const colorFor = {};
  for (const t of summary.teams || []) colorFor[String(t.teamId)] = teamColor(t.seoname);
  const chunks = summary.periods.map(p => {
    const list = (p.summary || []).filter(s => s.scoreType !== "XP" && s.scoreType !== "TPC");
    if (!list.length) return "";
    return `<div class="qhead">${esc(p.title)}</div>` + list.map(s => `
      <div class="play">
        <span class="sw" style="background:${esc(colorFor[String(s.teamId)] || FALLBACK_COLOR)}"></span>
        <span class="clock">${esc(s.time || "—")}</span>
        <span class="txt">${esc(s.scoreText)}</span>
      </div>`).join("");
  }).filter(Boolean);
  if (!chunks.length) return "";
  return `<h3>Scoring</h3><div class="plays">${chunks.join("")}</div>`;
}

function statsHTML(box) {
  const teams = box.teams || [];
  const away = sideOf(teams, false), home = sideOf(teams, true);
  if (!away || !home) return "";
  const statFor = (t) => (box.teamBoxscore || []).find(b => String(b.teamId) === String(t.teamId));
  const a = statFor(away), h = statFor(home);
  if (!a || !h || !a.teamStats || !h.teamStats) return "";

  const rows = [
    ["First downs", s => s.firstDowns],
    ["Total yards", s => s.teamYards],
    ["Passing yards", s => s.TeamPassingStats && s.TeamPassingStats.passingYards],
    ["Rushing yards", s => s.TeamRushingStats && s.TeamRushingStats.rushingYards],
    ["Third downs", s => `${num(s.thirdDowns)}/${num(s.thirdDownAttempts)}`],
    ["Penalties", s => `${num(s.penalty)}–${num(s.penaltyYards)} yds`],
    ["Turnovers", s => num(s.fumblesLost) + num(s.TeamPassingStats && s.TeamPassingStats.passingInterceptions)],
    ["Sacks", s => s.TeamDefenseStats && s.TeamDefenseStats.sacks],
  ];

  return `<h3>Team stats</h3>
    <table class="cmp"><tbody>
      <tr><td class="a">${esc(away.nameShort)}</td><td class="lbl"></td><td class="h">${esc(home.nameShort)}</td></tr>
      ${rows.map(([label, get]) => {
        const av = get(a.teamStats), hv = get(h.teamStats);
        if (av === undefined || av === null || hv === undefined || hv === null) return "";
        return `<tr><td class="a">${esc(av)}</td><td class="lbl">${esc(label)}</td><td class="h">${esc(hv)}</td></tr>`;
      }).join("")}
    </tbody></table>`;
}

// One readable line per stat category, e.g. "18/27, 245 yds, 2 TD".
// passingAttempts is sometimes "0" while completions are not, so the split is
// only shown when attempts are actually present.
function statLine(category, p) {
  const td = (n, label) => (num(n) ? `, ${num(n)} ${label}` : "");
  switch (category) {
    case "passing": {
      const att = num(p.passingAttempts), cmp = num(p.passingCompletions);
      const split = att ? `${cmp}/${att}` : `${cmp} comp`;
      return `${split}, <b>${num(p.passingYards)} yds</b>${td(p.passingTDs, "TD")}${td(p.passingInterceptions, "INT")}`;
    }
    case "rushing":
      return `${num(p.rushingAttempts)} car, <b>${num(p.rushingYards)} yds</b>${td(p.rushingTDs, "TD")}`;
    case "receiving":
      return `${num(p.receivingReceptions)} rec, <b>${num(p.receivingYards)} yds</b>${td(p.receivingTDs, "TD")}`;
    case "defense": {
      const bits = [`<b>${num(p.totalTackles)} tkl</b>`];
      if (num(p.sacks)) bits.push(`${num(p.sacks)} sack`);
      if (num(p.defenseInterceptions)) bits.push(`${num(p.defenseInterceptions)} INT`);
      if (num(p.fumblesRecovered)) bits.push(`${num(p.fumblesRecovered)} FR`);
      return bits.join(", ");
    }
    case "kicking": {
      const bits = [];
      if (num(p.fieldGoalsAttempted)) bits.push(`${num(p.fieldGoalsMade)}/${num(p.fieldGoalsAttempted)} FG`);
      if (num(p.patAttempted)) bits.push(`${num(p.patMade)}/${num(p.patAttempted)} XP`);
      return bits.length ? bits.join(", ") : `${num(p.kickingPts)} pts`;
    }
    case "punting":
      return `${num(p.puntingPunts)} punts, ${num(p.puntingAverage)} avg`;
    default:
      return "";
  }
}

// Best passer / rusher / receiver per team, by yards.
function leadersHTML(box) {
  const teams = box.teams || [];
  const away = sideOf(teams, false), home = sideOf(teams, true);
  if (!away || !home) return "";

  const best = (players, cat, yardKey) => {
    const list = (players || []).filter(p => p.category === cat);
    if (!list.length) return null;
    return list.reduce((a, b) => (num(b[yardKey]) > num(a[yardKey]) ? b : a));
  };
  const who = (p) => `${(p.firstName || "").charAt(0)}. ${titleCase(p.lastName || "")}`.trim();

  const block = (t) => {
    const tb = (box.teamBoxscore || []).find(b => String(b.teamId) === String(t.teamId));
    if (!tb) return "";
    const ps = tb.playerStats || [];
    const pass = best(ps, "passing", "passingYards");
    const rush = best(ps, "rushing", "rushingYards");
    const rec = best(ps, "receiving", "receivingYards");
    const lines = [];
    if (pass && num(pass.passingYards)) lines.push(["Pass", `${who(pass)} — ${statLine("passing", pass)}`, pass]);
    if (rush && num(rush.rushingYards)) lines.push(["Rush", `${who(rush)} — ${statLine("rushing", rush)}`, rush]);
    if (rec && num(rec.receivingYards)) lines.push(["Rec", `${who(rec)} — ${statLine("receiving", rec)}`, rec]);
    if (!lines.length) return "";
    return `<div class="ldr">
      <div class="who"><span class="sw" style="background:${esc(teamColor(t.seoname))};width:12px;height:12px;border-radius:2px;display:inline-block"></span>${esc(t.nameShort)}</div>
      ${lines.map(([c, v, p]) => {
        const key = playerKey(t.seoname, p);
        const on = players.has(key);
        return `<div class="row"><span class="cat">${c}</span><span class="val">${v}</span>
          <button class="follow" aria-pressed="${on}"
            data-follow="${esc(key)}" data-team="${esc(t.seoname)}"
            data-first="${esc(p.firstName || "")}" data-last="${esc(p.lastName || "")}"
            data-number="${esc(p.number ?? "")}" data-teamname="${esc(t.nameShort)}"
            aria-label="${on ? "Unfollow" : "Follow"} ${esc(titleCase(p.lastName || ""))}"
            title="${on ? "Unfollow" : "Follow this player"}">${on ? STAR : STAR_OFF}</button>
        </div>`;
      }).join("")}
    </div>`;
  };

  const inner = [block(away), block(home)].filter(Boolean).join("");
  if (!inner) return "";
  return `<h3>Leaders</h3><div class="leaders">${inner}</div>`;
}

// Player names arrive shouted ("DELANEY"). Title-case them, keeping the
// hyphen and apostrophe pieces capitalised (O'Brien, Parks-Gill).
//
// Short vowel-less words are left fully capitalised, because they're initials
// rather than names: RJ, TJ, CJ, JT. Testing for vowels keeps real two-letter
// names like Bo, Ty and Al out of it.
function titleCase(s) {
  return String(s)
    .toLowerCase()
    .replace(/[^\s]+/g, (word) =>
      word.length <= 3 && !/[aeiouy]/.test(word)
        ? word.toUpperCase()
        : word
            .replace(/(^|['’-])([a-z])/g, (_, sep, ch) => sep + ch.toUpperCase())
            .replace(/^Mc([a-z])/, (_, ch) => "Mc" + ch.toUpperCase()));
}

function sheetHeader(g, statusText, live) {
  const decided = hasScore(g);
  const row = (team, opponent) => {
    const won = decided && team.winner;
    const lost = decided && opponent.winner && !team.winner;
    return `<div class="side ${won ? "w" : ""} ${lost ? "l" : ""}">
      <span class="swatch" style="background:${esc(teamColor(team.names.seo))}"></span>
      <span class="nm">${esc(team.names.short)}</span>
      <span class="sc">${esc(team.score)}</span>
    </div>`;
  };
  return `<header>
    <div class="top">
      <span class="kicker ${live ? "live" : ""}">${esc(statusText)}</span>
      <span class="kicker" style="letter-spacing:.3px;text-transform:none">${esc(shortDayOf(g))}</span>
      <button class="close" id="shareDetail" aria-label="Share this game" title="Share">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="display:block;margin:auto">
          <path d="M12 15V4m0 0L8.5 7.5M12 4l3.5 3.5M5 13v5a2 2 0 002 2h10a2 2 0 002-2v-5"
            fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="close" id="closeDetail" aria-label="Close">✕</button>
    </div>
    ${row(g.away, g.home)}
    ${row(g.home, g.away)}
  </header>`;
}

const BASE_TITLE = document.title;
let openGameId = null;
let closingFromHistory = false;

function gameHeadline(g) {
  const a = g.away.names.short, h = g.home.names.short;
  return hasScore(g)
    ? `${a} ${g.away.score}, ${h} ${g.home.score}`
    : `${a} at ${h}`;
}

async function openGame(g, { fromHistory = false } = {}) {
  const s = statusOf(g);
  openGameId = String(g.gameID);
  document.title = `${gameHeadline(g)} — D3 Scores`;
  // Opening from a tap adds a history entry so Back closes the sheet. Opening
  // because the URL already said so must not add one.
  if (fromHistory) history.replaceState({ game: openGameId }, "", viewUrl(g.gameID));
  else history.pushState({ game: openGameId }, "", viewUrl(g.gameID));
  dlg.innerHTML = `<div class="sheet" tabindex="-1">${sheetHeader(g, s.text, s.live)}
    <div class="body"><p class="note" style="padding:18px 0">Loading box score…</p></div></div>`;
  if (!dlg.open) dlg.showModal();
  // Park focus on the sheet rather than letting it land on the close button,
  // which would show a focus ring that reads like an error state.
  dlg.querySelector(".sheet").focus();

  if (!hasScore(g)) {
    dlg.querySelector(".body").innerHTML =
      `<p class="note" style="padding:18px 0">This game hasn't started. Kickoff ${esc(g.startTime || "TBA")}.</p>`;
    return;
  }

  const get = async (resource) => {
    const r = await fetch(`${GAME_API}?id=${encodeURIComponent(g.gameID)}&resource=${resource}`);
    if (!r.ok) throw new Error(resource + " " + r.status);
    return r.json();
  };

  const [box, summary] = await Promise.all([
    get("boxscore").catch(() => null),
    get("scoring-summary").catch(() => null),
  ]);

  if (!box && !summary) {
    dlg.querySelector(".body").innerHTML =
      `<p class="note" style="padding:18px 0">The box score for this game isn't available yet.</p>`;
    return;
  }

  const parts = [
    summary ? lineScoreHTML(lineScore(summary)) : "",
    summary ? playsHTML(summary) : "",
    box ? statsHTML(box) : "",
    box ? leadersHTML(box) : "",
  ].filter(Boolean);

  dlg.querySelector(".body").innerHTML = parts.length
    ? parts.join("")
    : `<p class="note" style="padding:18px 0">No box score detail was published for this game.</p>`;
}

async function shareCurrentGame() {
  const g = games.find(x => String(x.gameID) === openGameId);
  if (!g) return;
  const url = location.origin + viewUrl(g.gameID);
  const text = `${gameHeadline(g)} — D3 Scores`;
  try {
    if (navigator.share) { await navigator.share({ title: text, text, url }); return; }
    await navigator.clipboard.writeText(url);
    toast("Link copied");
  } catch (err) {
    // The user dismissing the share sheet also lands here; that's not an error.
    if (err && err.name === "AbortError") return;
    toast("Couldn't copy the link");
  }
}

function toast(message) {
  const sheet = dlg.querySelector(".sheet");
  if (!sheet) return;
  const old = sheet.querySelector(".toast");
  if (old) old.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = message;
  sheet.style.position = "relative";
  sheet.appendChild(el);
  setTimeout(() => el.remove(), 1800);
}

dlg.addEventListener("click", (e) => {
  const follow = e.target.closest("button[data-follow]");
  if (follow) {
    const key = follow.dataset.follow;
    if (players.has(key)) players.delete(key);
    // Store the raw name as the API gave it. Formatting is applied at render
    // time, so improving the name rules fixes already-followed players too.
    else players.set(key, {
      team: follow.dataset.team,
      teamName: follow.dataset.teamname,
      number: follow.dataset.number,
      first: follow.dataset.first,
      last: follow.dataset.last,
    });
    savePlayers();
    const on = players.has(key);
    follow.setAttribute("aria-pressed", String(on));
    follow.innerHTML = on ? STAR : STAR_OFF;
    follow.title = on ? "Unfollow" : "Follow this player";
    renderPlayers();
    return;
  }
  if (e.target.closest("#shareDetail")) { shareCurrentGame(); return; }
  if (e.target.closest("#closeDetail")) { dlg.close(); return; }
  // Clicking the backdrop closes: the dialog element itself is the backdrop area.
  if (e.target === dlg) dlg.close();
});

// Closing the sheet — by button, backdrop, or Escape — should also undo the
// history entry, so Back doesn't reopen the game the user just dismissed.
dlg.addEventListener("close", () => {
  openGameId = null;
  document.title = BASE_TITLE;
  // Strip ?game= rather than calling history.back(). Back would walk off the
  // site entirely for someone who arrived on a shared game link.
  if (!closingFromHistory) history.replaceState({}, "", viewUrl(null));
});

// Keep the sheet in step with the URL when the user presses Back or Forward.
window.addEventListener("popstate", () => {
  const id = new URLSearchParams(location.search).get("game");
  if (!id) {
    if (dlg.open) {
      closingFromHistory = true;
      dlg.close();
      closingFromHistory = false;
    }
    return;
  }
  if (id === openGameId) return;
  const g = games.find(x => String(x.gameID) === id);
  if (g) openGame(g, { fromHistory: true });
});

// ---------------------------------------------------------------------------
// "Your players": for each followed player, find their team's game this week,
// pull that game's box score, and show their line. Box scores are fetched once
// per game and reused, so following four players on two teams costs two
// requests, not four.
// ---------------------------------------------------------------------------
const boxCache = new Map();

function getBox(gameID) {
  if (!boxCache.has(gameID)) {
    boxCache.set(gameID, fetch(`${GAME_API}?id=${encodeURIComponent(gameID)}&resource=boxscore`)
      .then(r => (r.ok ? r.json() : null))
      .catch(() => null));
  }
  return boxCache.get(gameID);
}

// Every stat line this player recorded in the game, across categories.
function playerLines(box, teamSeo, key) {
  const team = (box.teams || []).find(t => t.seoname === teamSeo);
  if (!team) return [];
  const tb = (box.teamBoxscore || []).find(b => String(b.teamId) === String(team.teamId));
  if (!tb) return [];
  const ORDER = ["passing", "rushing", "receiving", "defense", "kicking", "punting"];
  const LABEL = { passing: "Pass", rushing: "Rush", receiving: "Rec", defense: "Def", kicking: "Kick", punting: "Punt" };
  return (tb.playerStats || [])
    .filter(p => playerKey(teamSeo, p) === key)
    .sort((a, b) => ORDER.indexOf(a.category) - ORDER.indexOf(b.category))
    .map(p => [LABEL[p.category] || p.category, statLine(p.category, p)])
    .filter(([, v]) => v);
}

// `name` is the older stored shape; `first`/`last` is current.
function playerName(meta) {
  return meta.first || meta.last
    ? titleCase(`${meta.first || ""} ${meta.last || ""}`.trim())
    : String(meta.name || "Unknown");
}

function playerCard(meta, key, inner, quiet) {
  const name = playerName(meta);
  const no = meta.number ? `<span class="no">#${esc(meta.number)}</span> ` : "";
  return `<div class="pcard ${quiet ? "quiet" : ""}">
    <div class="ph">
      <span class="swatch" style="background:${esc(teamColor(meta.team))}"></span>
      <span class="pn">${no}${esc(name)}</span>
      <button class="drop" data-unfollow="${esc(key)}" aria-label="Unfollow ${esc(name)}" title="Unfollow">${STAR}</button>
    </div>
    ${inner}
  </div>`;
}

async function renderPlayers() {
  const host = document.getElementById("players");
  if (!players.size) { host.innerHTML = ""; return; }

  // Which game is each followed player's team in this week?
  const entries = [...players].map(([key, meta]) => {
    const g = games.find(x => x.home.names.seo === meta.team || x.away.names.seo === meta.team);
    return { key, meta, game: g };
  });

  const shell = (body) => `<section class="group pinned">
      <header><h2>Your players</h2><span class="n">${entries.length}</span><span class="rule"></span></header>
      <div class="grid">${body}</div>
    </section>`;

  // Draw immediately with what needs no request, then fill in the stat lines.
  host.innerHTML = shell(entries.map(({ key, meta, game }) => {
    if (!game) return playerCard(meta, key, `<p class="ctx">No game in week ${week}</p>`, true);
    const opp = game.home.names.seo === meta.team ? game.away : game.home;
    const at = game.home.names.seo === meta.team ? "vs" : "at";
    if (!hasScore(game)) {
      return playerCard(meta, key, `<p class="ctx">${at} ${esc(opp.names.short)} · ${esc(game.startTime || "TBA")}</p>`, true);
    }
    return playerCard(meta, key,
      `<p class="ctx">${at} ${esc(opp.names.short)} · ${esc(statusOf(game).text)}</p>
       <div data-slot="${esc(key)}"><p class="ctx">Loading…</p></div>`, false);
  }).join(""));

  // Now fetch the box scores, one per distinct game.
  await Promise.all(entries.filter(e => e.game && hasScore(e.game)).map(async ({ key, meta, game }) => {
    const box = await getBox(game.gameID);
    const slot = host.querySelector(`[data-slot="${CSS.escape(key)}"]`);
    if (!slot) return;
    const lines = box ? playerLines(box, meta.team, key) : [];
    slot.innerHTML = lines.length
      ? lines.map(([c, v]) => `<div class="stat"><span class="cat">${esc(c)}</span><span class="val">${v}</span></div>`).join("")
      : `<p class="ctx">No stats recorded</p>`;
  }));
}

// The week tabs are built once and then only re-flagged. Rebuilding them on
// every refresh would also re-run scrollIntoView, sliding the strip sideways
// under the reader's finger once a minute.
function buildWeeks() {
  document.getElementById("weeks").innerHTML =
    Array.from({ length: MAX_WEEK }, (_, i) => i + 1).map(w =>
      `<button data-week="${w}" aria-current="${w === week}">Week ${w}</button>`).join("");
}
function markWeek({ scroll = false } = {}) {
  for (const b of document.querySelectorAll("#weeks button")) {
    const on = Number(b.dataset.week) === week;
    b.setAttribute("aria-current", String(on));
    if (on && scroll) b.scrollIntoView({ block: "nearest", inline: "center" });
  }
}

function buildConfMenu() {
  const seen = new Set();
  for (const g of games) for (const s of [seoOf(g.home), seoOf(g.away)]) if (s) seen.add(s);
  const opts = [...seen].sort((a, b) => confName(a).localeCompare(confName(b)));
  const sel = document.getElementById("conf");
  sel.innerHTML =
    (favs.size ? `<option value="favourites">Your teams (${favs.size})</option>` : "") +
    `<option value="all">All of Division III</option>` +
    opts.map(s => `<option value="${esc(s)}">${esc(confName(s))}</option>`).join("");
  if (conf === "favourites" && !favs.size) conf = "all";
  sel.value = conf;
}

async function load() {
  try {
    const res = await fetch(`${API}?year=2026&week=${String(week).padStart(2, "0")}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    games = (data.games || []).map(x => x.game);
    // The API returns games in no useful order. Sort by kickoff time.
    games.sort((a, b) => Number(a.startTimeEpoch) - Number(b.startTimeEpoch));

    // Nothing has been played yet this week — show last week's results instead.
    if (!weekWasChosen && !triedFallback && week > 1 && !games.some(hasScore)) {
      triedFallback = true;
      week -= 1;
      markWeek({ scroll: true });
      syncUrl();
      return load();
    }

    trackScores(games);
    buildConfMenu();
    render();
    if (view === "scores") renderPlayers();
    // A shared ?game= link can only be opened once the week's games are in.
    if (pendingGame) {
      const g = games.find(x => String(x.gameID) === pendingGame);
      pendingGame = null;
      if (g) openGame(g, { fromHistory: true });
    }
    lastGoodLoad = Date.now();
    showFreshness();
  } catch (err) {
    // Never wipe scores that are already on screen. A dropped poll on stadium
    // wifi should cost you freshness, not the whole board — one blip used to
    // replace every score with an error message.
    if (!games.length) {
      document.getElementById("board").innerHTML =
        `<p class="msg">Scores aren't loading.<span class="hint">Check your connection — this will keep retrying. (${esc(err.message)})</span></p>`;
    }
    showFreshness();
  }
}

// How old the scores on screen actually are. A frozen page should say so
// rather than quietly show minute-old numbers as though they were current.
let lastGoodLoad = 0;

function showFreshness() {
  const foot = document.getElementById("foot");
  if (!lastGoodLoad) { foot.textContent = "Loading scores…"; return; }
  const secs = Math.round((Date.now() - lastGoodLoad) / 1000);
  const when = new Date(lastGoodLoad).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  if (secs < 90) foot.textContent = `Scores refresh every minute. Updated ${when}.`;
  else {
    const mins = Math.round(secs / 60);
    foot.textContent = `Not updating — last reached the scores ${mins} minute${mins === 1 ? "" : "s"} ago (${when}).`;
  }
}

document.getElementById("conf").addEventListener("change", e => {
  conf = e.target.value;
  syncUrl();
  render();
});

document.getElementById("weeks").addEventListener("click", e => {
  const btn = e.target.closest("button[data-week]");
  if (!btn) return;
  week = Number(btn.dataset.week);
  weekWasChosen = true;      // never override a week the reader picked
  markWeek();
  syncUrl();
  load();
});

document.getElementById("players").addEventListener("click", e => {
  const drop = e.target.closest("button[data-unfollow]");
  if (!drop) return;
  players.delete(drop.dataset.unfollow);
  savePlayers();
  renderPlayers();
});

document.getElementById("views").addEventListener("click", e => {
  const btn = e.target.closest("button[data-view]");
  if (!btn || btn.dataset.view === view) return;
  view = btn.dataset.view;
  syncUrl();
  render();
  if (view === "scores") renderPlayers();
});

document.getElementById("board").addEventListener("change", e => {
  if (e.target.id !== "sosYear") return;
  sosYear = e.target.value;
  syncUrl();
  renderSos();
});

document.getElementById("board").addEventListener("click", e => {
  const rz = e.target.closest(".rzg[data-game]");
  if (rz) {
    const g = games.find(x => String(x.gameID) === rz.dataset.game);
    if (g) openGame(g);
    return;
  }
  const btn = e.target.closest("button.fav");
  if (btn) {
    const seo = btn.dataset.seo;
    if (favs.has(seo)) favs.delete(seo); else favs.add(seo);
    saveFavs();
    buildConfMenu();
    render();
    return;
  }
  const card = e.target.closest(".game[data-game]");
  if (card) {
    const g = games.find(x => String(x.gameID) === card.dataset.game);
    if (g) openGame(g);
  }
});

// Cards are divs with role=button, so Enter and Space have to be wired by hand.
document.getElementById("board").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const card = e.target.closest(".game[data-game]");
  if (!card || e.target.closest("button.fav")) return;
  e.preventDefault();
  const g = games.find(x => String(x.gameID) === card.dataset.game);
  if (g) openGame(g);
});

buildWeeks();
markWeek({ scroll: true });
load();
setInterval(load, 60000);   // upstream caches for 60s, so refreshing faster is pointless

// Mobile browsers suspend timers when the phone locks or the tab is hidden, so
// coming back to the page would show stale scores with no sign of it. Refresh
// on return, but only if what's on screen has actually gone stale.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  showFreshness();
  if (Date.now() - lastGoodLoad > 45000) load();
});

// Keep the freshness line truthful between polls: if the network is down, the
// footer needs to start saying so without waiting for a successful load.
setInterval(showFreshness, 15000);
</script>
</body>
</html>
